<head>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"> </script>
</head>
<body>
  <a href="/rq">Go to monitor</a><br/><br/>

  <h3>Send POST request to /&lt;tool&gt;</h3>

  {# One form per tool in tools.py, no editing needed when a tool is added #}
  {% for tool in tools %}
  <div style="float:left;">
    <h4>{{ tool.name }}</h4>
    <form id="{{ tool.name }}_form" data-endpoint="/{{ tool.name }}" method="post" enctype="multipart/form-data">
      <input type="file" name="file" required/><br/>
      {% for field in tool.fields %}
      <input type="text" name="{{ field }}" placeholder="{{ tool.placeholders.get(field, field) }}" required/><br/>
      {% endfor %}
      <input type="text" name="webhook" placeholder="optional webhook"/><br/>
      <input type="password" name="password" placeholder="password" required/><br/>
      <button>Submit</button>
    </form>
  </div>
  {% endfor %}

  <div style="float:left; clear:left;">
    <h3>Response from POST request to /&lt;tool&gt;</h3>
    <textarea id="post_result" readonly rows="8" cols="80"></textarea>
  </div>
  <br/>

  <div style="float:left; clear:left;">
    <h3>GET response from /get/&lt;id&gt;</h3>
    <textarea id="result" readonly rows="20" cols="80"></textarea>
  </div>

</body>
